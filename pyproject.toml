[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "xpgrad"
version = "0.0.1"
description = "Personal machine-learning library"
readme = "README.txt"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["xpgrad*"]

[tool.pyright]
reportIncompatibleMethodOverride = false

